<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
</head>
<body>
<h1>Formulário 1</h1>
<form action="" method="post">
    <label>
        Nome:
        <br>
        <input name="form_nome" type="text" placeholder="Digite seu nome" required>
    </label>
    <br>
<br>
    <label>
        Email:
        <br>
        <input name="form_email" type="email" placeholder="Digite seu email" required>
    </label>
    <br>
<br>
    <label>
        Assunto:
        <br>
        <input name="form_assunto" type="text" placeholder="Digite o assunto">
    </label>
    <br>
<br>
    <label>
        Mensagem:
        <br>
        <textarea name="form_mensagem" rows="10" cols="13"></textarea>
    </label>
    <br>
    <br>
    <button type="submit">Enviar</button>
    <button type="reset">Limpar</button>
</body>
</html>
